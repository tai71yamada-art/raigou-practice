<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>雷轟 -天弓- ストーリー（ADVモック）</title>
<style>
:root{
  --bg:#0d0f16; --ink:#f4f1ea; --sub:#aeb3c2; --line:#3a3f52; --accent:#ffd23f;
  --win-alpha:.82; --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:#000; color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; overscroll-behavior:none; }
button{ font:inherit; color:inherit; }
#app{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#screen{ position:relative; width:100%; height:100%; max-width:560px; overflow:hidden; background:var(--bg); user-select:none; -webkit-user-select:none; }

/* ---------- 背景 ---------- */
.bgl{ position:absolute; inset:0; transition:opacity .6s; }
.bg-black{ background:#000; }
.bg-pod{ background:
  radial-gradient(ellipse 60% 30% at 50% 18%, rgba(255,140,60,.35), transparent 70%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 46px),
  linear-gradient(#1b1f2a, #0b0d12 70%, #191c25); }
.bg-pod::after{ content:""; position:absolute; left:8%; right:8%; top:8%; height:26%; border:2px solid rgba(255,150,80,.35); border-radius:40% 40% 12px 12px; box-shadow:0 0 30px rgba(255,120,40,.25) inset; }
.bg-night{ background:
  radial-gradient(1px 1px at 20% 15%, #fff, transparent), radial-gradient(1px 1px at 70% 8%, #fff, transparent),
  radial-gradient(1.5px 1.5px at 85% 25%, #fff, transparent), radial-gradient(1px 1px at 40% 30%, #fff, transparent),
  radial-gradient(1px 1px at 10% 40%, #fff, transparent), radial-gradient(1px 1px at 60% 22%, #fff, transparent),
  linear-gradient(#060a1c, #18244a 55%, #2b2f4a 75%, #1a1714); }
.bg-night::after,.bg-waste::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:38%;
  background:linear-gradient(#141210,#0a0908); clip-path:polygon(0 30%,12% 18%,24% 32%,38% 10%,52% 28%,66% 14%,80% 30%,92% 20%,100% 26%,100% 100%,0 100%); }
.bg-waste{ background:linear-gradient(#3a1e2c, #b0533a 45%, #f0a24a 62%, #3d2a22 63%); }
.bg-waste::after{ background:linear-gradient(#2a1d17,#120c0a); }
.bg-label{ position:absolute; left:10px; top:calc(env(safe-area-inset-top) + 8px); font-size:.7rem; color:rgba(255,255,255,.45); letter-spacing:.1em; }

/* ---------- 立ち絵 ---------- */
#chars{ position:absolute; inset:0; pointer-events:none; }
.ch{ position:absolute; bottom:-14%; height:96%; transform:translateX(-50%); transition:left .35s, opacity .35s, filter .3s; filter:brightness(.55) saturate(.8); opacity:0; }
.ch.on{ opacity:1; }
.ch.speak{ filter:none; }
.ch img{ height:100%; display:block; }
.pos-left{ left:30%; } .pos-center{ left:50%; } .pos-right{ left:70%; }

/* ---------- 効果 ---------- */
#flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
#flash.go{ animation:flash .55s ease-out; }
@keyframes flash{ 0%{opacity:0} 8%{opacity:.95} 20%{opacity:.2} 30%{opacity:.85} 100%{opacity:0} }
#screen.shake{ animation:shake .45s; }
@keyframes shake{ 0%,100%{transform:none} 20%{transform:translate(-6px,3px)} 40%{transform:translate(5px,-4px)} 60%{transform:translate(-4px,2px)} 80%{transform:translate(3px,-2px)} }

/* ---------- メッセージ窓 ---------- */
#ui{ position:absolute; left:0; right:0; bottom:0; padding:0 10px calc(env(safe-area-inset-bottom) + 8px); }
#ui.hidden{ display:none; }
#tools{ display:flex; gap:4px; justify-content:flex-end; margin-bottom:6px; flex-wrap:wrap; }
.tb{ background:rgba(10,12,20,.72); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font-size:.72rem; min-width:42px; }
.tb.on{ background:var(--accent); color:#111; border-color:var(--accent); font-weight:bold; }
#win{ position:relative; min-height:150px; background:rgba(12,14,24,var(--win-alpha)); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:22px 16px 18px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
#name{ position:absolute; left:12px; top:-14px; display:flex; align-items:center; gap:6px; padding:4px 14px 4px 8px; border-radius:6px; background:var(--nc,#444); color:#111; font-weight:bold; font-size:.92rem; box-shadow:0 2px 8px rgba(0,0,0,.4); }
#name:empty{ display:none; }
#name img{ width:20px; height:20px; }
#text{ font-family:var(--serif); font-size:1.02rem; line-height:1.85; min-height:3.7em; white-space:pre-wrap; }
#text.narr{ color:#e6e2d6; }
#next{ position:absolute; right:14px; bottom:8px; font-size:.8rem; color:var(--accent); opacity:0; animation:blink 1s infinite; }
#next.show{ opacity:1; }
@keyframes blink{ 50%{ transform:translateY(3px); } }
#mode{ position:absolute; right:12px; top:calc(env(safe-area-inset-top) + 8px); font-size:.72rem; padding:3px 8px; border-radius:6px; background:var(--accent); color:#111; font-weight:bold; display:none; }

/* ---------- 選択肢 ---------- */
#choices{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,.35); padding:0 24px 120px; }
#choices.show{ display:flex; }
.cbtn{ width:100%; max-width:380px; padding:14px 12px; border-radius:10px; border:1px solid rgba(240,122,42,.7); background:rgba(14,16,26,.9); font-family:var(--serif); font-size:1rem; }
.cbtn:active{ background:#f07a2a; color:#111; }

/* ---------- 重ねる画面（ログ・セーブ・設定・タイトル） ---------- */
.ov{ position:absolute; inset:0; background:rgba(8,9,14,.96); display:none; flex-direction:column; padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px); z-index:20; }
.ov.show{ display:flex; }
.ov h2{ margin:0 0 10px; font-family:var(--serif); font-size:1.15rem; border-left:4px solid #f07a2a; padding-left:10px; }
.ov .body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.ov .foot{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
.btn{ background:#1d2130; border:1px solid var(--line); border-radius:10px; padding:10px 18px; font-size:.92rem; }
.btn.primary{ background:#f07a2a; color:#111; border-color:#f07a2a; font-weight:bold; }
.btn:disabled{ opacity:.4; }

.log-item{ padding:10px 4px; border-bottom:1px solid #22263a; }
.log-name{ font-size:.78rem; font-weight:bold; margin-bottom:2px; }
.log-text{ font-family:var(--serif); line-height:1.7; white-space:pre-wrap; }
.log-choice{ color:#f0a24a; font-size:.85rem; }

.tabs{ display:flex; gap:6px; margin-bottom:10px; }
.tab{ flex:1; padding:8px 0; border-radius:8px; background:#1a1d2a; border:1px solid var(--line); font-size:.85rem; }
.tab.on{ background:#f07a2a; color:#111; font-weight:bold; border-color:#f07a2a; }
.slots{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.slot{ position:relative; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#151826; text-align:left; padding:0; }
.slot .thumb{ position:relative; aspect-ratio:16/10; overflow:hidden; }
.slot .thumb .bgl::after{ transform:none; }
.slot .thumb .mini{ position:absolute; bottom:-75%; height:190%; transform:translateX(-50%); }
.slot .thumb .mtext{ position:absolute; left:4px; right:4px; bottom:4px; background:rgba(10,12,20,.8); border-radius:4px; font-size:.58rem; line-height:1.35; padding:3px 5px; max-height:2.9em; overflow:hidden; font-family:var(--serif); }
.slot .meta{ padding:5px 7px 7px; font-size:.68rem; color:var(--sub); }
.slot .meta b{ display:block; color:var(--ink); font-size:.74rem; margin-bottom:1px; }
.slot .no{ position:absolute; left:5px; top:4px; z-index:2; font-size:.65rem; background:rgba(0,0,0,.6); padding:1px 6px; border-radius:4px; }
.slot.empty .thumb{ display:flex; align-items:center; justify-content:center; color:#555b70; font-size:.8rem; background:#0f111a; }
.slot .del{ position:absolute; right:4px; top:4px; z-index:2; font-size:.62rem; background:rgba(0,0,0,.65); border:1px solid #555; border-radius:4px; padding:1px 6px; }
.slot.latest{ border-color:#f07a2a; }

.set-row{ padding:12px 2px; border-bottom:1px solid #22263a; }
.set-row label{ display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:6px; }
.set-row input[type=range]{ width:100%; accent-color:#f07a2a; }
.set-row .note{ font-size:.72rem; color:var(--sub); margin-top:4px; }
.seg{ display:flex; gap:6px; }
.seg button{ flex:1; padding:7px 0; border-radius:8px; background:#1a1d2a; border:1px solid var(--line); font-size:.82rem; }
.seg button.on{ background:#f07a2a; color:#111; font-weight:bold; }
.preview{ margin-top:8px; padding:10px; border-radius:8px; background:rgba(12,14,24,var(--win-alpha)); border:1px solid #333; font-family:var(--serif); min-height:3.2em; }

/* タイトル */
#title{ background:#000; justify-content:flex-end; align-items:center; padding-bottom:calc(env(safe-area-inset-bottom) + 34px); }
#title .kv{ position:absolute; inset:0; background:center 20%/cover no-repeat; opacity:.9; }
#title .kv::after{ content:""; position:absolute; inset:0; background:linear-gradient(transparent 45%, rgba(0,0,0,.92) 80%); }
#title .menu{ position:relative; display:flex; flex-direction:column; gap:10px; width:72%; max-width:300px; }
#title .menu .btn{ padding:13px; font-family:var(--serif); font-size:1.02rem; background:rgba(16,18,28,.85); }
#title .menu .btn.primary{ background:#f07a2a; color:#111; }
#title .tag{ position:relative; font-size:.72rem; color:var(--sub); margin-bottom:14px; letter-spacing:.12em; }

/* 確認・お知らせ */
#dlg{ position:absolute; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:40; padding:24px; }
#dlg.show{ display:flex; }
#dlg .box{ width:100%; max-width:340px; background:#171a27; border:1px solid #444a60; border-radius:14px; padding:18px 16px 14px; }
#dlg p{ margin:0 0 14px; line-height:1.7; font-size:.92rem; }
#dlg .foot{ display:flex; gap:8px; justify-content:center; }
#toast{ position:absolute; left:50%; top:calc(env(safe-area-inset-top) + 40px); transform:translateX(-50%); background:rgba(240,122,42,.95); color:#111; font-weight:bold; font-size:.82rem; padding:6px 14px; border-radius:20px; opacity:0; transition:opacity .25s; z-index:50; pointer-events:none; }
#toast.show{ opacity:1; }
#tapcatch{ position:absolute; inset:0; }
</style>
</head>
<body>
<div id="app"><div id="screen">
  <div id="bg" class="bgl bg-black"></div>
  <div class="bg-label" id="bgLabel"></div>
  <div id="chars"></div>
  <div id="tapcatch"></div>
  <div id="flash"></div>
  <div id="mode"></div>
  <div id="choices"></div>
  <div id="ui">
    <div id="tools">
      <button class="tb" data-t="auto">オート</button>
      <button class="tb" data-t="skip">スキップ</button>
      <button class="tb" data-t="log">ログ</button>
      <button class="tb" data-t="qsave">Qセーブ</button>
      <button class="tb" data-t="qload">Qロード</button>
      <button class="tb" data-t="save">セーブ</button>
      <button class="tb" data-t="load">ロード</button>
      <button class="tb" data-t="hide">隠す</button>
      <button class="tb" data-t="menu">設定</button>
    </div>
    <div id="win">
      <div id="name"></div>
      <div id="text"></div>
      <div id="next">▼</div>
    </div>
  </div>

  <!-- タイトル -->
  <div class="ov show" id="title">
    <div class="kv" style="background-image:url({{KV}})"></div>
    <div class="tag">ストーリーモード（ADVパートのモック）</div>
    <div class="menu">
      <button class="btn primary" id="tStart">はじめから</button>
      <button class="btn" id="tCont">つづきから</button>
      <button class="btn" id="tLoad">ロード</button>
      <button class="btn" id="tConf">設定</button>
    </div>
  </div>

  <!-- ログ -->
  <div class="ov" id="logOv">
    <h2>ログ</h2>
    <div class="body" id="logBody"></div>
    <div class="foot"><button class="btn primary" data-close="logOv">閉じる</button></div>
  </div>

  <!-- セーブ／ロード -->
  <div class="ov" id="slotOv">
    <h2 id="slotTitle">セーブ</h2>
    <div class="tabs" id="slotTabs"></div>
    <div class="body"><div class="slots" id="slotList"></div></div>
    <div class="foot"><button class="btn primary" data-close="slotOv">閉じる</button></div>
  </div>

  <!-- 設定 -->
  <div class="ov" id="confOv">
    <h2>設定</h2>
    <div class="body">
      <div class="set-row"><label>文字の速さ<span id="vSpeed"></span></label><input type="range" id="cSpeed" min="0" max="10" step="1">
        <div class="preview" id="cPreview"></div></div>
      <div class="set-row"><label>オートの待ち時間<span id="vAuto"></span></label><input type="range" id="cAuto" min="0" max="10" step="1"></div>
      <div class="set-row"><label>メッセージ窓の濃さ<span id="vAlpha"></span></label><input type="range" id="cAlpha" min="30" max="100" step="5"></div>
      <div class="set-row"><label>スキップする文章</label>
        <div class="seg" id="cSkip"><button data-v="read">読んだ文章だけ</button><button data-v="all">全部</button></div></div>
      <div class="set-row"><label>BGMの音量<span id="vBgm"></span></label><input type="range" id="cBgm" min="0" max="100" step="10">
        <div class="note">モックでは、まだ音は鳴りません（音量は保存されます）。</div></div>
      <div class="set-row"><label>効果音の音量<span id="vSe"></span></label><input type="range" id="cSe" min="0" max="100" step="10"></div>
      <div class="set-row"><label>画面の揺れ・光</label>
        <div class="seg" id="cFx"><button data-v="on">あり</button><button data-v="off">なし</button></div></div>
    </div>
    <div class="foot"><button class="btn" id="cTitle">タイトルへ</button><button class="btn primary" data-close="confOv">閉じる</button></div>
  </div>

  <div id="dlg"><div class="box"><p id="dlgText"></p><div class="foot" id="dlgFoot"></div></div></div>
  <div id="toast"></div>
</div></div>

<script>
'use strict';
/* ================= 登場人物・背景のデータ ================= */
const CHARA = {
  iroha: { name:'赤月 いろは', yomi:'あかつき いろは', color:'#f07a2a', img:'{{IROHA}}', crest:'{{IROHA_CREST}}', faceY:'8%' },
  kurara:{ name:'雷藏 くらら', yomi:'らくら くらら', color:'#ffd23f', img:'{{KURARA}}', crest:'{{KURARA_CREST}}', faceY:'6%' }
};
const BG = {
  black:{ cls:'bg-black', label:'' },
  pod:  { cls:'bg-pod',   label:'脱出艇の中' },
  night:{ cls:'bg-night', label:'荒野・夜' },
  waste:{ cls:'bg-waste', label:'荒野・夜明け' }
};

/* ================= 台本（モック用の短い場面） =================
   命令：{scene}場面の名前 {bg} {show,pos} {hide} {say,text}（sayを省くと地の文） {fx} {choice:[{text,jump}]} {label} {jump} {set} {end} */
const SCRIPT = [
  { scene:'序章　光の落ちた夜' },
  { bg:'black' },
  { text:'……暗い。\n遠くで、何かが鳴っている。' },
  { text:'規則正しい電子音。それから、聞いたことのない言葉の、くり返し。' },
  { bg:'pod' },
  { text:'目を開けると、狭い部屋の天井が見えた。\n橙色のランプが、ゆっくりと点滅している。' },
  { show:'iroha', pos:'center' },
  { say:'iroha', text:'……ここ、どこ？' },
  { say:'iroha', text:'体が重い。頭の中に、霧がかかっているみたい。\n思い出そうとすると、するりと逃げていく。' },
  { text:'足元に、金属の箱がひとつ置いてあった。\n手を伸ばしかけたその時、部屋が大きく揺れた。' },
  { fx:'shake' },
  { say:'iroha', text:'わっ！？' },
  { text:'扉の向こうから、甲高い機械音が近づいてくる。\n考えるより先に、体が動いていた。' },
  { hide:'iroha' },
  { bg:'night' },
  { show:'iroha', pos:'center' },
  { text:'外は、見渡すかぎりの荒野だった。\n夜空に、いくつもの赤い光が浮かんでいる。' },
  { say:'iroha', text:'あれ……こっちに来る！' },
  { text:'赤い光は、空を飛ぶ機械だった。\n一つ、また一つと向きを変え、まっすぐこちらへ降りてくる。' },
  { say:'kurara', text:'そこのあんた！　伏せて！！' },
  { fx:'flash' },
  { text:'次の瞬間、空を裂くような雷が落ちた。\n機械が火花を散らし、地面へ転がっていく。' },
  { show:'iroha', pos:'left' },
  { show:'kurara', pos:'right' },
  { say:'kurara', text:'ふう、間に合った！\nあんた、ケガはない？' },
  { say:'iroha', text:'う、うん……。今の、あなたがやったの？' },
  { say:'kurara', text:'もちろん！　あたしは雷藏 くらら。\nで、あんたはどこの家の者？　見ない顔だね。' },
  { choice:[
      { text:'「……わからない。何も思い出せないの」', jump:'honest' },
      { text:'「家……？　家って、何のこと？」', jump:'ask' }
  ] },
  { label:'honest' },
  { set:'honest' },
  { say:'iroha', text:'……わからない。\n自分の名前も、どこから来たのかも、何も思い出せないの。' },
  { say:'kurara', text:'えっ、ほんとに？\nそっか……。それは困ったね。' },
  { jump:'name' },
  { label:'ask' },
  { say:'iroha', text:'家……？　家って、何のこと？' },
  { say:'kurara', text:'雷轟術を使う一族の家だよ。知らないの？\n……あんた、もしかして何も覚えてない？' },
  { say:'iroha', text:'……うん。名前も、思い出せない。' },
  { label:'name' },
  { say:'kurara', text:'うーん……あ、待って。\nその服、何か書いてある。' },
  { say:'kurara', text:'「AKA」……「TSUKI」？\nあかつき……赤い、月？' },
  { say:'iroha', text:'赤い月……。' },
  { say:'iroha', text:'その下にも、何か書いてある。\n「IROHA」……いろは。' },
  { say:'kurara', text:'じゃあ、あんたは「赤月 いろは」だ！\n雷轟術の家に、そんな名前の家があった気がする。……たぶん！' },
  { say:'iroha', text:'たぶん、なんだ……。\nでも、ありがとう。くらら。' },
  { bg:'waste' },
  { text:'東の空が、少しずつ明るくなっていく。\n光の落ちた夜が、終わろうとしていた。' },
  { say:'kurara', text:'よし、決まり！\n赤月家のことを知ってそうな人のところへ、一緒に行こう。いろは！' },
  { if:'honest', say:'iroha', text:'……うん。\n何もわからないけど、ここで立ち止まっているよりはいい。' },
  { ifnot:'honest', say:'iroha', text:'……うん。\n家のことも、わたしのことも、ちゃんと知りたい。' },
  { hide:'kurara' }, { hide:'iroha' },
  { text:'（モックはここまでです。タップするとタイトルに戻ります）' },
  { end:true }
];

/* ================= 保存（端末に保存。使えない環境では、開いている間だけ覚える） ================= */
const KEY = 'raigou.adv.mock.v1';
const MEM = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(KEY + '.' + k); return v === null ? d : JSON.parse(v); }catch(e){ return k in MEM ? MEM[k] : d; } },
  set(k, v){ try{ localStorage.setItem(KEY + '.' + k, JSON.stringify(v)); }catch(e){ MEM[k] = v; } }
};
const CONF = Object.assign({ speed:6, auto:5, alpha:82, skip:'read', bgm:70, se:70, fx:'on' }, store.get('conf', {}));
let READ = new Set(store.get('read', []));
const SLOT_PAGES = 3, SLOT_PER_PAGE = 6;

/* ================= 進行の状態 ================= */
const S = { i:0, bg:'black', chars:{}, speaker:null, flags:{}, scene:'', log:[] };
let typing = null, waiting = false, autoOn = false, skipOn = false, autoTimer = null, busy = false, playing = false;
const $ = function(id){ return document.getElementById(id); };
const LABELS = {}; SCRIPT.forEach(function(c, i){ if(c.label) LABELS[c.label] = i; });

function applyConf(){
  document.documentElement.style.setProperty('--win-alpha', (CONF.alpha / 100).toFixed(2));
}
function charDelay(){ return CONF.speed >= 10 ? 0 : Math.round(80 - CONF.speed * 7.5); }
function autoWait(len){ return 600 + (10 - CONF.auto) * 180 + len * (40 + (10 - CONF.auto) * 6); }

/* ---------- 画面に反映 ---------- */
function drawBg(){ const b = BG[S.bg] || BG.black; $('bg').className = 'bgl ' + b.cls; $('bgLabel').textContent = b.label; }
function drawChars(){
  const box = $('chars');
  Object.keys(CHARA).forEach(function(id){
    let el = box.querySelector('[data-ch="' + id + '"]');
    const pos = S.chars[id];
    if(!el){
      el = document.createElement('div'); el.className = 'ch'; el.setAttribute('data-ch', id);
      el.innerHTML = '<img alt="" src="' + CHARA[id].img + '">'; box.appendChild(el);
    }
    el.classList.toggle('on', !!pos);
    if(pos){ el.classList.remove('pos-left','pos-center','pos-right'); el.classList.add('pos-' + pos); }
    el.classList.toggle('speak', !!pos && (S.speaker === id || !S.speaker || Object.keys(S.chars).length === 1));
  });
}
function setName(id){
  const n = $('name');
  if(!id){ n.innerHTML = ''; return; }
  const c = CHARA[id];
  n.style.setProperty('--nc', c.color);
  n.innerHTML = '<img alt="" src="' + c.crest + '">' + c.name;
}
function drawAll(){ drawBg(); drawChars(); }

/* ---------- 文章の表示 ---------- */
function showText(str, narr, done){
  const el = $('text');
  el.classList.toggle('narr', !!narr);
  $('next').classList.remove('show');
  const d = skipOn ? 0 : charDelay();
  if(d === 0){ el.textContent = str; finish(); return; }
  let k = 0; el.textContent = '';
  typing = { finish:finish };
  typing.id = setInterval(function(){
    k++; el.textContent = str.slice(0, k);
    if(k >= str.length) finish();
  }, d);
  function finish(){
    if(typing){ clearInterval(typing.id); typing = null; }
    el.textContent = str;
    $('next').classList.add('show');
    waiting = true;
    done && done();
  }
}
function completeTyping(){ if(typing && typing.finish) typing.finish(); }

/* ---------- 台本を1つずつ進める ---------- */
function step(){
  if(busy) return;
  waiting = false; clearTimeout(autoTimer);
  while(S.i < SCRIPT.length){
    const c = SCRIPT[S.i];
    if(c.if && !S.flags[c.if]){ S.i++; continue; }
    if(c.ifnot && S.flags[c.ifnot]){ S.i++; continue; }
    if(c.scene){ S.scene = c.scene; S.i++; continue; }
    if(c.label){ S.i++; continue; }
    if(c.jump){ S.i = LABELS[c.jump]; continue; }
    if(c.set){ S.flags[c.set] = true; S.i++; continue; }
    if(c.bg){ S.bg = c.bg; drawBg(); S.i++; continue; }
    if(c.show){ S.chars[c.show] = c.pos || 'center'; S.i++; drawChars(); continue; }
    if(c.hide){ delete S.chars[c.hide]; S.i++; drawChars(); continue; }
    if(c.fx){ S.i++; doFx(c.fx); continue; }
    if(c.end){ stopModes(); toTitle(); return; }
    if(c.choice){ showChoice(c.choice); return; }
    if(c.text !== undefined){ sayLine(c); return; }
    S.i++;
  }
}
function lineKey(i){ return 'L' + i; }
function sayLine(c){
  const idx = S.i;
  _lastSay = idx;   // 表示中の行（セーブすると、この行から再開する）
  S.speaker = c.say || null;
  drawChars(); setName(c.say);
  const name = c.say ? CHARA[c.say].name : '';
  S.log.push({ n:name, c: c.say ? CHARA[c.say].color : '', t:c.text });
  if(S.log.length > 200) S.log.shift();
  const wasRead = READ.has(lineKey(idx));
  if(skipOn && CONF.skip === 'read' && !wasRead){ stopModes(); toast('まだ読んでいない文章なので、スキップを止めました'); }
  showText(c.text, !c.say, function(){
    READ.add(lineKey(idx)); store.set('read', Array.from(READ));
    S.i = idx + 1;
    if(skipOn){ autoTimer = setTimeout(step, 70); }
    else if(autoOn){ autoTimer = setTimeout(step, autoWait(c.text.length)); }
  });
}
function doFx(kind){
  if(CONF.fx === 'off' || skipOn) return;
  if(kind === 'flash'){ const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  if(kind === 'shake'){ const s = $('screen'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
}
function showChoice(list){
  stopModes();
  const box = $('choices');
  box.innerHTML = list.map(function(o, k){ return '<button class="cbtn" data-k="' + k + '">' + o.text + '</button>'; }).join('');
  box.classList.add('show');
  autoSave();
  box.querySelectorAll('[data-k]').forEach(function(b){
    b.addEventListener('click', function(ev){
      ev.stopPropagation();
      const o = list[+b.getAttribute('data-k')];
      box.classList.remove('show');
      S.log.push({ n:'', c:'', t:'▶ ' + o.text.replace(/[「」]/g, ''), choice:true });
      S.i = LABELS[o.jump];
      step();
    });
  });
}

/* ---------- タップ・モード ---------- */
function onTap(){
  if(!playing || busy) return;
  if($('ui').classList.contains('hidden')){ $('ui').classList.remove('hidden'); return; }
  if(autoOn || skipOn){ stopModes(); return; }
  if($('choices').classList.contains('show')) return;
  if(typing){ completeTyping(); return; }
  if(waiting) step();
}
function stopModes(){ autoOn = false; skipOn = false; clearTimeout(autoTimer); drawModes(); }
function drawModes(){
  document.querySelector('[data-t="auto"]').classList.toggle('on', autoOn);
  document.querySelector('[data-t="skip"]').classList.toggle('on', skipOn);
  const m = $('mode'); m.style.display = (autoOn || skipOn) ? 'block' : 'none'; m.textContent = autoOn ? 'オート' : 'スキップ中';
}
function toggleAuto(){
  skipOn = false; autoOn = !autoOn; drawModes();
  if(autoOn){ if(typing) return; if(waiting) autoTimer = setTimeout(step, 400); }
}
function toggleSkip(){
  autoOn = false; skipOn = !skipOn; drawModes();
  if(skipOn){
    if(typing) completeTyping(); else if(waiting) step();
  }
}

/* ---------- セーブ／ロード ---------- */
function snapshot(){
  const last = S.log.length ? S.log[S.log.length - 1] : null;
  return { v:1, i: currentLineIndex(), bg:S.bg, chars:Object.assign({}, S.chars), speaker:S.speaker, flags:Object.assign({}, S.flags),
           scene:S.scene, log:S.log.slice(-60), at:Date.now(), text: last ? (last.n ? last.n + '「' + last.t.replace(/\n/g, '') + '」' : last.t.replace(/\n/g, '')) : '' };
}
/* セーブは「今表示している文章（または選択肢）」から再開できる位置を記録する */
function currentLineIndex(){
  if($('choices').classList.contains('show')) return S.i;
  return waiting || typing ? lastSayIndex() : S.i;
}
let _lastSay = 0;
function lastSayIndex(){ return _lastSay; }
function restore(d){
  stopModes(); clearTimeout(autoTimer); if(typing){ clearInterval(typing.id); typing = null; }
  $('choices').classList.remove('show');
  S.i = d.i; S.bg = d.bg; S.chars = Object.assign({}, d.chars); S.speaker = d.speaker; S.flags = Object.assign({}, d.flags); S.scene = d.scene;
  S.log = (d.log || []).slice(0, -1);   // 再開する文章はこのあともう一度ログに入る
  if(SCRIPT[S.i] && SCRIPT[S.i].choice) S.log = (d.log || []).slice();
  drawAll(); setName(null); $('text').textContent = '';
  playing = true; closeAll(); $('ui').classList.remove('hidden');
  step();
}
function slotKey(n){ return 'slot.' + n; }
function getSlot(n){ return store.get(slotKey(n), null); }
function putSlot(n, d){ store.set(slotKey(n), d); store.set('latest', n); }
function autoSave(){ if(playing) putSlotNoLatest('auto', snapshot()); }
function putSlotNoLatest(n, d){ store.set(slotKey(n), d); }
function fmtDate(t){ const d = new Date(t); const p = function(x){ return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function thumbHtml(d){
  const b = BG[d.bg] || BG.black;
  let h = '<div class="bgl ' + b.cls + '"></div>';
  const ids = Object.keys(d.chars || {});
  ids.forEach(function(id){
    const x = { left:'30%', center:'50%', right:'70%' }[d.chars[id]] || '50%';
    h += '<img class="mini" alt="" style="left:' + x + '" src="' + CHARA[id].img + '">';
  });
  h += '<div class="mtext">' + esc(d.text || '') + '</div>';
  return h;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let slotMode = 'save', slotPage = 0;
function openSlots(mode){
  slotMode = mode;
  $('slotTitle').textContent = mode === 'save' ? 'セーブ' : 'ロード';
  const latest = store.get('latest', null);
  if(latest !== null && latest !== 'q' && latest !== 'auto') slotPage = Math.floor((latest - 1) / SLOT_PER_PAGE);
  drawSlots(); $('slotOv').classList.add('show');
}
function drawSlots(){
  const tabs = [];
  for(let p = 0; p < SLOT_PAGES; p++) tabs.push('<button class="tab' + (p === slotPage ? ' on' : '') + '" data-p="' + p + '">' + (p + 1) + '</button>');
  tabs.push('<button class="tab' + (slotPage === 'extra' ? ' on' : '') + '" data-p="extra">Q・オート</button>');
  $('slotTabs').innerHTML = tabs.join('');
  $('slotTabs').querySelectorAll('[data-p]').forEach(function(b){ b.addEventListener('click', function(){ const v = b.getAttribute('data-p'); slotPage = v === 'extra' ? 'extra' : +v; drawSlots(); }); });
  const nums = slotPage === 'extra' ? ['q','auto'] : Array.from({ length:SLOT_PER_PAGE }, function(_, k){ return slotPage * SLOT_PER_PAGE + k + 1; });
  const latest = store.get('latest', null);
  $('slotList').innerHTML = nums.map(function(n){
    const d = getSlot(n);
    const label = n === 'q' ? 'クイック' : (n === 'auto' ? 'オート' : 'No.' + n);
    if(!d) return '<button class="slot empty" data-n="' + n + '"><span class="no">' + label + '</span><div class="thumb">空き</div><div class="meta"><b>―</b>&nbsp;</div></button>';
    return '<div class="slot' + (latest === n ? ' latest' : '') + '" data-n="' + n + '" role="button" tabindex="0"><span class="no">' + label + '</span>' +
      (typeof n === 'number' ? '<button class="del" data-del="' + n + '">消す</button>' : '') +
      '<div class="thumb">' + thumbHtml(d) + '</div><div class="meta"><b>' + esc(d.scene || '') + '</b>' + fmtDate(d.at) + '</div></div>';
  }).join('');
  $('slotList').querySelectorAll('[data-n]').forEach(function(el){
    el.addEventListener('click', function(){ slotAction(el.getAttribute('data-n')); });
  });
  $('slotList').querySelectorAll('[data-del]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.stopPropagation(); const n = +el.getAttribute('data-del');
      confirmDlg('No.' + n + 'のセーブを消しますか？', '消す', function(){ store.set(slotKey(n), null); drawSlots(); }); });
  });
}
function slotAction(nRaw){
  const n = (nRaw === 'q' || nRaw === 'auto') ? nRaw : +nRaw;
  const d = getSlot(n);
  if(slotMode === 'save'){
    if(n === 'auto'){ toast('オートセーブの枠には、選択肢の前で自動で記録します'); return; }
    if(!playing){ toast('物語を始めてからセーブできます'); return; }
    const doSave = function(){ putSlot(n, snapshot()); drawSlots(); toast((n === 'q' ? 'クイック' : 'No.' + n) + 'にセーブしました'); };
    if(d) confirmDlg((n === 'q' ? 'クイック' : 'No.' + n) + 'に上書きしますか？', '上書きする', doSave); else doSave();
  } else {
    if(!d){ toast('この枠にはセーブがありません'); return; }
    const go = function(){ restore(d); toast('ロードしました'); };
    if(playing) confirmDlg('ロードしますか？\n今の進み具合のうち、セーブしていない所は失われます。', 'ロードする', go); else go();
  }
}
function quickSave(){ if(!playing) return; putSlot('q', snapshot()); toast('クイックセーブしました'); }
function quickLoad(){
  const d = getSlot('q'); if(!d){ toast('クイックセーブがありません'); return; }
  confirmDlg('クイックセーブした所に戻りますか？', '戻る', function(){ restore(d); toast('クイックロードしました'); });
}

/* ---------- ログ ---------- */
function openLog(){
  $('logBody').innerHTML = S.log.map(function(l){
    if(l.choice) return '<div class="log-item log-choice">' + esc(l.t) + '</div>';
    return '<div class="log-item">' + (l.n ? '<div class="log-name" style="color:' + l.c + '">' + esc(l.n) + '</div>' : '') + '<div class="log-text">' + esc(l.t) + '</div></div>';
  }).join('') || '<p style="color:#888">まだ文章がありません。</p>';
  $('logOv').classList.add('show');
  const b = $('logBody'); b.scrollTop = b.scrollHeight;
}

/* ---------- 設定 ---------- */
function openConf(){
  const bind = function(id, key, fmt){
    const el = $(id); el.value = CONF[key];
    const show = function(){ const v = $(id.replace('c', 'v')); if(v) v.textContent = fmt(+el.value); };
    show();
    el.oninput = function(){ CONF[key] = +el.value; show(); applyConf(); store.set('conf', CONF); if(key === 'speed') previewText(); };
  };
  bind('cSpeed', 'speed', function(v){ return v >= 10 ? '一瞬で表示' : v + ' / 10'; });
  bind('cAuto', 'auto', function(v){ return v === 0 ? '長い' : (v === 10 ? '短い' : v + ' / 10'); });
  bind('cAlpha', 'alpha', function(v){ return v + '%'; });
  bind('cBgm', 'bgm', function(v){ return v + '%'; });
  bind('cSe', 'se', function(v){ return v + '%'; });
  const seg = function(id, key){
    $(id).querySelectorAll('button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-v') === CONF[key]);
      b.onclick = function(){ CONF[key] = b.getAttribute('data-v'); store.set('conf', CONF); seg(id, key); };
    });
  };
  seg('cSkip', 'skip'); seg('cFx', 'fx');
  $('cTitle').style.display = playing ? '' : 'none';
  $('confOv').classList.add('show');
  previewText();
}
let pvTimer = null;
function previewText(){
  clearInterval(pvTimer);
  const s = 'この速さで文章が表示されます。', el = $('cPreview'), d = charDelay();
  if(d === 0){ el.textContent = s; return; }
  let k = 0; el.textContent = '';
  pvTimer = setInterval(function(){ k++; el.textContent = s.slice(0, k); if(k >= s.length) clearInterval(pvTimer); }, d);
}

/* ---------- 共通 ---------- */
function closeAll(){ ['logOv','slotOv','confOv','title'].forEach(function(id){ $(id).classList.remove('show'); }); }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('show'); }, 1700); }
function confirmDlg(text, okLabel, onOk){
  $('dlgText').textContent = text; $('dlgText').style.whiteSpace = 'pre-wrap';
  $('dlgFoot').innerHTML = '<button class="btn primary" id="dOk">' + okLabel + '</button><button class="btn" id="dNo">やめる</button>';
  $('dlg').classList.add('show');
  $('dOk').onclick = function(){ $('dlg').classList.remove('show'); onOk(); };
  $('dNo').onclick = function(){ $('dlg').classList.remove('show'); };
}
function toTitle(){
  playing = false; stopModes(); if(typing){ clearInterval(typing.id); typing = null; }
  $('choices').classList.remove('show');
  closeAll(); $('title').classList.add('show'); drawTitle();
}
function drawTitle(){ $('tCont').disabled = !getSlot('auto') && !getSlot('q') && !store.get('latest', null); }
function newGame(){
  Object.assign(S, { i:0, bg:'black', chars:{}, speaker:null, flags:{}, scene:'', log:[] });
  $('text').textContent = ''; setName(null); drawAll();
  playing = true; closeAll(); $('ui').classList.remove('hidden');
  step();
}
function continueGame(){
  /* 最後にセーブした枠（手動・クイック・オートのうち、いちばん新しいもの） */
  const cands = ['q','auto'].concat(Array.from({ length:SLOT_PAGES * SLOT_PER_PAGE }, function(_, k){ return k + 1; }))
    .map(function(n){ return getSlot(n); }).filter(Boolean).sort(function(a, b){ return b.at - a.at; });
  if(!cands.length){ toast('セーブがありません'); return; }
  restore(cands[0]);
}


/* ---------- 操作の登録 ---------- */
$('tapcatch').addEventListener('click', onTap);
$('win').addEventListener('click', onTap);
$('tools').addEventListener('click', function(ev){
  const b = ev.target.closest('[data-t]'); if(!b) return;
  ev.stopPropagation();
  const t = b.getAttribute('data-t');
  if(t !== 'auto' && t !== 'skip') stopModes();
  if(t === 'auto') toggleAuto();
  else if(t === 'skip') toggleSkip();
  else if(t === 'log') openLog();
  else if(t === 'save') openSlots('save');
  else if(t === 'load') openSlots('load');
  else if(t === 'qsave') quickSave();
  else if(t === 'qload') quickLoad();
  else if(t === 'hide') $('ui').classList.add('hidden');
  else if(t === 'menu') openConf();
});
document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', function(){ $(b.getAttribute('data-close')).classList.remove('show'); if(!playing) $('title').classList.add('show'); }); });
$('tStart').addEventListener('click', newGame);
$('tCont').addEventListener('click', continueGame);
$('tLoad').addEventListener('click', function(){ $('title').classList.remove('show'); openSlots('load'); });
$('tConf').addEventListener('click', function(){ $('title').classList.remove('show'); openConf(); });
$('cTitle').addEventListener('click', function(){ confirmDlg('タイトルに戻りますか？\nセーブしていない所は失われます。', '戻る', toTitle); });
document.addEventListener('keydown', function(e){
  if(!playing || document.querySelector('.ov.show')) return;
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onTap(); }
});
/* 画面の外へ出たら、オート・スキップを止めてオートセーブ */
document.addEventListener('visibilitychange', function(){ if(document.hidden && playing){ stopModes(); autoSave(); } });
applyConf(); drawTitle();
</script>
</body>
